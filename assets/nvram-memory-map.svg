<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="sh3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="540" rx="16" fill="url(#bgGrad3)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <rect x="30" y="24" width="1140" height="64" rx="10" fill="#161f30" stroke="#334155" stroke-width="1.5"/>
  <circle cx="62" cy="56" r="8" fill="#38bdf8"/>
  <text x="84" y="51" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#f8fafc">THINKPAD T430 64KB UEFI NVRAM ANATOMY &amp; BIOS F1 HALT FORENSICS</text>
  <text x="84" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#94a3b8">Why "Non-volatile memory is full (Press F1)" triggers at &gt;90% occupancy (~10KB POST threshold) and how Setup Mode + pstore_disable fixes it</text>

  <!-- ================= BAR 1: BLOATED / HALTING STATE ================= -->
  <g filter="url(#sh3)">
    <rect x="40" y="114" width="1120" height="185" rx="12" fill="#1a1116" stroke="#ef4444" stroke-width="2"/>
    <text x="64" y="144" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#fca5a5">❌ BEFORE: Factory Keys + Ubuntu `sbkeysync` + `efi-pstore` Crash Dumps (93.3%+ Full → BIOS F1 HALT)</text>
    <text x="1136" y="144" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#f87171">Total Capacity: 65,516 Bytes (64 KB)</text>

    <!-- Segmented Memory Bar 1 (Total width = 1072px) -->
    <!-- System Vars: 34.4 KB (~52.5%) = 562px -->
    <rect x="64" y="162" width="550" height="58" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="339" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0">Lenovo BIOS &amp; ACPI System Variables (~140 entries)</text>
    <text x="339" y="207" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94a3b8">~34.4 KB (52.5%)</text>

    <!-- Secure Boot DBX + Keys: 26.7 KB (~40.8%) = 438px -->
    <rect x="618" y="162" width="430" height="58" rx="6" fill="#7c2d12" stroke="#f97316" stroke-width="1.5"/>
    <text x="833" y="188" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#fed7aa">Secure Boot Keys (`dbx` 17.9KB + `db` 4.2KB + `KEK`/`PK`)</text>
    <text x="833" y="207" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#fdba74">26.7 KB (40.8%) — Refilled at boot by `sbkeysync`!</text>

    <!-- Free / pstore overflow: 4.3 KB (~6.7%) = 80px -->
    <rect x="1052" y="162" width="84" height="58" rx="6" fill="#991b1b" stroke="#ef4444" stroke-width="2"/>
    <text x="1094" y="187" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#ffffff">4.3 KB</text>
    <text x="1094" y="205" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#fecaca">FREE (6.7%)</text>

    <!-- Explanation Footnotes Bar 1 -->
    <text x="64" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#fecdd3">• BIOS POST requires ~10 KB free margin. With only 4,375 bytes free (plus Nouveau `efi-pstore` oops dumps), POST halts on every boot.</text>
    <text x="64" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#fde68a">• Trap: "Restore Factory Keys" in BIOS re-writes the 26.7 KB keys, and Ubuntu's `secureboot-db.service` (`sbkeysync`) re-injects `dbx` on boot!</text>
  </g>

  <!-- ================= BAR 2: HARDENED / CLEAN STATE ================= -->
  <g filter="url(#sh3)">
    <rect x="40" y="324" width="1120" height="185" rx="12" fill="#0d1f17" stroke="#22c55e" stroke-width="2"/>
    <text x="64" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#86efac">✅ AFTER: BIOS "Reset to Setup Mode" + Purge `secureboot-db` + `efi_pstore.pstore_disable=1` (&gt;48% Free)</text>
    <text x="1136" y="354" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#4ade80">Zero POST Warnings • Permanent Fix</text>

    <!-- System Vars: 34.4 KB (~52.5%) = 550px -->
    <rect x="64" y="372" width="550" height="58" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="339" y="398" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#e2e8f0">Lenovo BIOS &amp; ACPI System Variables (~140 entries)</text>
    <text x="339" y="417" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94a3b8">~34.4 KB (52.5%)</text>

    <!-- Free Space: 31.1 KB (~47.5%) = 518px -->
    <rect x="618" y="372" width="518" height="58" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <text x="877" y="398" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">31.1 KB RECLAIMED &amp; FREE (47.5% Unallocated NVRAM Headroom)</text>
    <text x="877" y="417" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#bbf7d0">3× above the 10 KB Lenovo POST safety threshold</text>

    <!-- Explanation Footnotes Bar 2 -->
    <text x="64" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#d1fae5">1. BIOS → Security → Secure Boot → "Reset to Setup Mode" (wipes 26.7 KB of unused PK/KEK/db/dbx certificates)</text>
    <text x="64" y="480" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#d1fae5">2. Linux → `apt purge secureboot-db` + GRUB `efi_pstore.pstore_disable=1` + `/etc/fwupd/fwupd.conf` `DisabledPlugins=uefi_dbx;`</text>
  </g>
</svg>

